# Render Blueprint: https://render.com/docs/blueprint-spec
# Deploys the Docker image as a public demo: packaged sample corpus and the offline mock provider.
# To lock it down or use a real LLM, add OMNIKNOW_API_KEYS (and OMNIKNOW_PROVIDER,
# OMNIKNOW_API_KEY, ...) as secret environment variables in the Render dashboard.
services:
  - type: web
    name: omniknow-ai-multimodal-rag
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: OMNIKNOW_PROVIDER
        value: mock
      # Render's proxy appends the real client IP to X-Forwarded-For (per-client rate limits)
      - key: OMNIKNOW_TRUST_PROXY
        value: "true"
