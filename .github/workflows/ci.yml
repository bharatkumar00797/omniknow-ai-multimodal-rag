name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      - name: Type check
        run: mypy
      - name: Test
        run: pytest

  docker:
    name: Docker image smoke test
    runs-on: ubuntu-24.04
    needs: test
    steps:
      - uses: actions/checkout@v5
      - name: Validate compose file
        run: docker compose config --quiet
      - name: Build and start the hardened container
        run: docker compose up --build --detach --wait --wait-timeout 180
      - name: Smoke test (health, CSP, cited answers, ACLs, injection flags, evals)
        run: python3 scripts/smoke_test.py http://127.0.0.1:8000
      - name: API-key mode rejects anonymous calls
        run: |
          docker run --detach --name omniknow-keyed --read-only --tmpfs /tmp --cap-drop ALL \
            --security-opt no-new-privileges:true -e PORT=9000 \
            -e OMNIKNOW_API_KEYS=ci-smoke-key -p 9000:9000 omniknow-ai-multimodal-rag:local
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:9000/healthz && break; sleep 1; done
          python3 scripts/smoke_test.py http://127.0.0.1:9000
          python3 scripts/smoke_test.py http://127.0.0.1:9000 --api-key ci-smoke-key
      - name: Container logs
        if: always()
        run: |
          docker compose logs --no-color
          docker logs omniknow-keyed || true
      - name: Stop
        if: always()
        run: |
          docker rm -f omniknow-keyed || true
          docker compose down --volumes
